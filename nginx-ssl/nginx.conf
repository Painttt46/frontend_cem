# นี้คือ config ของ nginx-ssl-proxy บน production (172.30.101.52)
# ตำแหน่งจริงบน prod: /home/support/nginx-ssl/nginx.conf
# (bind-mount เข้า container nginx-ssl-proxy ที่ /etc/nginx/conf.d/default.conf)
#
# สำคัญ: client_max_body_size 200M — ถ้าไม่มีบรรทัดนี้ nginx จะตัดอัปโหลดที่
# ใหญ่กว่า 1MB (default) เป็น 413 ก่อนถึง backend แม้ backend รับได้ 200MB
# แก้ไฟล์นี้บน prod แล้ว reload ด้วย: docker exec nginx-ssl-proxy nginx -s reload

server {
    listen 3000 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    client_max_body_size 200M;

    location / {
        proxy_pass http://frontend-cem:80;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
