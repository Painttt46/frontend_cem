# นี้คือ config ของ nginx-ssl-proxy บน production (172.30.101.52)
# ตำแหน่งจริงบน prod: /home/support/nginx-ssl/nginx.conf
# (bind-mount เข้า container nginx-ssl-proxy ที่ /etc/nginx/conf.d/default.conf)
#
# สำคัญ: client_max_body_size 0 (ไม่จำกัด) — ถ้าไม่มีบรรทัดนี้ nginx จะตัดอัปโหลดที่
# ใหญ่กว่า 1MB (default) เป็น 413 ก่อนถึง backend
# แก้ไฟล์นี้บน prod แล้ว reload ด้วย: docker exec nginx-ssl-proxy nginx -s reload

server {
    listen 3000 ssl;
    server_name _;

    ssl_certificate /etc/nginx/ssl/server.crt;
    ssl_certificate_key /etc/nginx/ssl/server.key;

    client_max_body_size 0;   # 0 = ไม่จำกัดขนาด
    # default ของ nginx = 60 วินาที ทำให้อัปโหลดไฟล์ใหญ่ที่ใช้เวลานานถูกตัดกลางทาง
    client_body_timeout 600s;
    send_timeout 600s;

    # ให้ nginx หา IP ของ frontend-cem ใหม่ทุก 10 วินาทีผ่าน DNS ของ Docker
    # (เดิม resolve ครั้งเดียวตอนสตาร์ท — หลัง rebuild frontend-cem ได้ IP ใหม่ แล้ว proxy ยังยิง IP เก่า = 502 ทั้งหน้าเว็บและ API)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        set $frontend_upstream http://frontend-cem:80;
        proxy_pass $frontend_upstream;
        proxy_request_buffering off;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
