# header ความปลอดภัยของหน้าเว็บ (ไฟล์ static) — include ในทุก location ที่เสิร์ฟไฟล์เอง
# ไม่ใส่ระดับ server: /api และ /uploads มี header ของ helmet จาก backend อยู่แล้ว (ใส่ซ้ำจะได้ CSP สองชุดซ้อนกัน)
# และ add_header ใน location จะลบของระดับบนทิ้งทั้งหมด จึงต้อง include ทุกที่ที่มี add_header อื่น

# ห้ามเว็บอื่นเอาไปฝังใน iframe (หลอกให้กดปุ่ม)
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# ใช้แค่ตำแหน่ง (หน้า Sale) — ถ่ายรูปผ่านช่องเลือกไฟล์ไม่ต้องใช้สิทธิ์ camera
add_header Permissions-Policy "geolocation=(self), camera=(), microphone=(), payment=(), usb=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;

# โหลดสคริปต์ได้จากเว็บนี้เท่านั้น (สคริปต์ที่ถูกแทรกเข้ามาจะไม่ทำงาน)
#   style 'unsafe-inline' : PrimeVue ใส่ style เอง
#   img data:/blob:       : รูปจองรถ (base64) และรูปตัวอย่างก่อนอัปโหลด
#   connect               : api.ipify.org = IP ตอน login, 172.30.101.52:3002 = แชท (ตรงกับ VUE_APP_GENT_URL ใน .env — เปลี่ยนที่นั่นต้องเปลี่ยนที่นี่ด้วย)
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' https://api.ipify.org http://172.30.101.52:3002; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;
