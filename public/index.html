<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=5.0,user-scalable=yes">
    
    <!-- Favicon -->
    <!-- ไอคอนเป็น SVG ต้องประกาศ type ให้ตรง (เดิมระบุ image/png → เบราว์เซอร์ไม่ใช้ แล้วไปขอ /favicon.ico ที่ไม่มีอยู่ทุกครั้งที่เปลี่ยนหน้า = 404 ซ้ำใน log) -->
    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>GENT.svg">
    <!-- สำรองสำหรับเบราว์เซอร์ที่ไม่รองรับไอคอน SVG (Safari) และไอคอนหน้าจอหลัก iOS (ไม่รองรับ SVG) -->
    <link rel="alternate icon" type="image/png" href="<%= BASE_URL %>GENT.png">
    <link rel="apple-touch-icon" href="<%= BASE_URL %>GENT.png">
    
    <!-- Meta tags -->
    <meta name="description" content="Gent-CEM Management System">
    <meta name="theme-color" content="#4A90E2">
    
    <title>Gent-CEM</title>
  </head>
  <body>
    <noscript>
      <strong>We're sorry but Gent-CEM doesn't work properly without JavaScript enabled. Please enable it to continue.</strong>
    </noscript>
    <div id="app"></div>
    <!-- built files will be auto injected -->
  </body>
</html>
