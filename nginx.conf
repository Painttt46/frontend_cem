server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    
    client_max_body_size 0;
    client_body_timeout 600s;
    send_timeout 600s;

    # บีบอัดผลลัพธ์ — API ที่ตอบ JSON ก้อนใหญ่ (เช่น task-steps/all ~750KB) ลดเหลือราว 1 ใน 10 ทำให้หน้าโหลดเร็วขึ้น
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_vary on;
    gzip_proxied any;
    gzip_types application/json application/javascript text/css text/plain image/svg+xml application/xml;

    # ให้ nginx หา IP ของ backend ใหม่ทุก 10 วินาทีผ่าน DNS ของ Docker
    # (เดิม resolve ครั้งเดียวตอนสตาร์ท — หลัง rebuild/restart container backend ได้ IP ใหม่ แล้ว nginx ยังยิง IP เก่า = 502)
    resolver 127.0.0.11 valid=10s ipv6=off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html ห้ามแคช — กัน browser จับ bundle เก่าหลัง deploy
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # static assets มี hash ในชื่อไฟล์ — แคชยาวได้ปลอดภัย
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ^~ = ห้ามเอา regex (ด้านบนที่จับนามสกุลไฟล์ static) มาแย่ง — ไม่งั้น /uploads/xxx.png ถูกมองเป็นไฟล์ static แล้วได้ 404
    location ^~ /uploads {
        set $backend_upstream http://backend-cem:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    # ^~ = ห้ามเอา regex ของไฟล์ static มาแย่ง — เดิม /api/files/download/xxx.png (รูปแนบ) ถูกจับเป็นไฟล์ static แล้วได้ 404
    location ^~ /api {
        set $backend_upstream http://backend-cem:3001;
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        client_max_body_size 0;
        proxy_request_buffering off;
        proxy_connect_timeout 600;
        proxy_send_timeout 600;
        proxy_read_timeout 600;
        send_timeout 600;
    }
}
